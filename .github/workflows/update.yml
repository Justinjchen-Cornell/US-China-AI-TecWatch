name: Update AI Tracker

on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 UTC 00:00
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sub-project dependencies
        run: |
          pip install -e ai-models   # numpy/pandas/jinja2 来自 pyproject
          pip install numpy

      - name: Build main index
        run: |
          python scripts/update_snapshot.py
          python scripts/build_site.py

      - name: Build semiconductor sub-project
        run: |
          python semiconductor/scripts/update_snapshot.py
          python semiconductor/scripts/build_site.py --site-dir ../site/semiconductor

      - name: Build ai-models sub-project
        run: |
          python ai-models/build_report.py --site-dir ../site/ai-models

      - name: Build quantum sub-project
        run: |
          python quantum/build_report.py --site-dir ../site/quantum

      - name: Build fusion sub-project
        run: |
          python fusion/build_report.py --site-dir ../site/fusion

      - name: Build bio sub-project
        run: |
          python bio/build_report.py --site-dir ../site/bio

      - name: Build embodied sub-project
        run: |
          python embodied/build_report.py --site-dir ../site/embodied

      - name: Rebuild main site (refresh industry cards)
        run: python scripts/build_site.py

      - name: Smoke test (JS syntax + API fields)
        run: python scripts/smoke_test.py

      - name: Commit updated data & site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data semiconductor/data ai-models/data ai-models/site site
          git diff --cached --quiet || git commit -m "chore: weekly snapshot & index rebuild [skip ci]"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
