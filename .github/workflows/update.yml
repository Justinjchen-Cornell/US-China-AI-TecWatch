name: Update AI Tracker

on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 UTC 00:00
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate snapshot & compute index & build site
        run: |
          python scripts/update_snapshot.py
          python scripts/build_site.py

      - name: Commit updated data & site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots site
          git diff --cached --quiet || git commit -m "chore: weekly snapshot & index rebuild [skip ci]"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
